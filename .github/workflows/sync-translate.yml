name: sync-and-translate
on:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ko-translate
  cancel-in-progress: false
jobs:
  translate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/translate_ko.py
      - name: push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: ko translation" && git pull --rebase origin main && git push origin main; }
