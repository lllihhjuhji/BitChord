name: sync-and-translate
on:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ko-translate
  cancel-in-progress: false
jobs:
  translate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/translate_ko.py
      - name: commit translation
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: ko translation"
            git pull --rebase origin main
            git push origin main
          fi
      - name: release if main changed
        run: |
          git fetch --tags
          LAST=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          HEAD_SHA=$(git rev-parse origin/main)
          NEED=true
          if [ -n "$LAST" ] && [ "$(git rev-list -n1 "$LAST")" = "$HEAD_SHA" ]; then NEED=false; fi
          BUSY=$(gh run list --workflow android.yml --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          echo "last=$LAST need=$NEED busy=$BUSY"
          if [ "$NEED" = true ] && [ "$BUSY" = "0" ]; then
            gh workflow run android.yml --ref main
          fi
