name: Sync upstream
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kushagrasinghx/BitChord.git
          git fetch upstream
          if [ "$(git rev-list --count HEAD..upstream/main)" = "0" ]; then
            echo "No new upstream commits"
            exit 0
          fi
          git merge upstream/main --no-edit
          git push origin HEAD
          gh workflow run android.yml --repo "${{ github.repository }}"
